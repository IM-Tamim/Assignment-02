<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Assignment 02</title>
    <link rel="stylesheet" href="./styles.css" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
      integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
  </head>
  <body class="font-['Inter']">
    <header>
      <nav
        class="bg-[#0f0f2f] px-[12rem] py-[1.2rem] flex items-center justify-between"
      >
        <div class="text-white font-bold text-2xl">
          Tech<span class="text-pink-500">Wave</span>
        </div>

        <div class="flex text-white font-medium">
          <a href="" class="mr-8">About</a>
          <a href="" class="mr-8">Episodes</a>
          <a href="">Host</a>
        </div>

        <div>
          <button class="btn">Subscribe →</button>
        </div>
      </nav>

      <section
        class="h-[47.5rem] bg-[url('./assets/hero-bg.png')] bg-cover bg-center flex justify-center items-center text-white"
      >
        <div class="text-center w-[420px]">
          <!-- ONLY relative container -->
          <div class="relative mx-auto w-[21.875rem] h-[21.875rem]">
            <!-- Gradient circle IMAGE -->
            <img
              src="./assets/hero-circle.png"
              alt="Hero Circle"
              class="absolute inset-0 w-full h-full object-contain"
            />

            <!-- Mic on top -->
            <div class="absolute inset-0 flex justify-center items-center">
              <img
                src="./assets/microphone.png"
                alt="Microphone"
                class="w-[5rem]"
              />
            </div>

            <div
              class="absolute top-4 right-4 bg-green-400 text-black text-[1.125rem] font-bold px-3 py-1 rounded-full"
            >
              NEW
            </div>
          </div>

          <h1 class="mt-8 text-5xl font-extrabold">TechWave</h1>

          <p class="mt-3 text-sm text-gray-300 leading-relaxed">
            Your daily dose of tech insights, productivity hacks, and personal
            growth
          </p>

          <div class="mt-6 flex justify-center gap-4">
            <button class="btn">
              <i class="fa-brands fa-spotify"></i> Listen On Spotify
            </button>

            <button
              class="px-6 py-3 rounded-full border border-green-400 text-green-400 hover:bg-green-400 hover:text-black transition"
            >
              <i class="fa-regular fa-message"></i> Subscribe
            </button>
          </div>
        </div>
      </section>
    </header>
  </body>
</html>
